name: nas-game-server

services:
  controller:
    build:
      context: ./controller
    image: nas-game-controller:local
    container_name: nas-game-controller
    restart: unless-stopped
    init: true
    network_mode: host
    environment:
      CONTROL_HOST: "0.0.0.0"
      CONTROL_PORT: "${CONTROL_PORT:-8088}"
      CONTROL_ACCOUNTS_JSON: "${CONTROL_ACCOUNTS_JSON}"
      CONTROL_SESSION_TTL_SECONDS: "${CONTROL_SESSION_TTL_SECONDS:-43200}"
      GAMES_CONFIG: "/app/games.json"
      HOST_PROJECT_PATH: "${HOST_PROJECT_PATH:-/volume1/docker/nas_game_server}"
      HOST_PROJECT_MOUNT: "/host-project"
      MC_IMAGE: "${MC_IMAGE:-itzg/minecraft-server:stable-java25}"
      MC_GAME_PORT: "${MC_GAME_PORT:-25566}"
      MC_MEMORY: "${MEMORY:-14G}"
      MC_VERSION: "${VERSION:-26.2}"
      NEOFORGE_VERSION: "${NEOFORGE_VERSION:-26.2.0.62}"
      NEOFORGE_INSTALLER: "${NEOFORGE_INSTALLER:-/installer/neoforge-26.2.0.62-installer.jar}"
      EULA: "${EULA:-FALSE}"
      PROXY: "${PROXY:-}"
      PUID: "${PUID:-1000}"
      PGID: "${PGID:-1000}"
      TZ: "${TZ:-Asia/Shanghai}"
      MOTD: "${MOTD:-Synology NeoForge 26.2 Server}"
      MAX_PLAYERS: "${MAX_PLAYERS:-10}"
      DIFFICULTY: "${DIFFICULTY:-normal}"
      VIEW_DISTANCE: "${VIEW_DISTANCE:-10}"
      SIMULATION_DISTANCE: "${SIMULATION_DISTANCE:-8}"
      ENABLE_WHITELIST: "${ENABLE_WHITELIST:-FALSE}"
      WHITELIST: "${WHITELIST:-}"
      OPS: "${OPS:-}"
      ONLINE_MODE: "${ONLINE_MODE:-TRUE}"
      ENFORCE_SECURE_PROFILE: "${ENFORCE_SECURE_PROFILE:-TRUE}"
      BACKUP_INTERVAL_SECONDS: "${BACKUP_INTERVAL_SECONDS:-259200}"
      BACKUP_CHECK_INTERVAL_SECONDS: "${BACKUP_CHECK_INTERVAL_SECONDS:-3600}"
      PALWORLD_IMAGE: "${PALWORLD_IMAGE:-thijsvanloef/palworld-server-docker:latest}"
      PALWORLD_PORT: "${PALWORLD_PORT:-8211}"
      PALWORLD_QUERY_PORT: "${PALWORLD_QUERY_PORT:-27015}"
      PALWORLD_PLAYERS: "${PALWORLD_PLAYERS:-16}"
      PALWORLD_SERVER_NAME: "${PALWORLD_SERVER_NAME:-Synology Palworld Server}"
      PALWORLD_SERVER_DESCRIPTION: "${PALWORLD_SERVER_DESCRIPTION:-Palworld dedicated server on Synology NAS}"
      PALWORLD_SERVER_PASSWORD: "${PALWORLD_SERVER_PASSWORD:-}"
      PALWORLD_ADMIN_PASSWORD: "${PALWORLD_ADMIN_PASSWORD:-admin123}"
      PALWORLD_COMMUNITY: "${PALWORLD_COMMUNITY:-false}"
      PALWORLD_CROSSPLAY_PLATFORMS: "${PALWORLD_CROSSPLAY_PLATFORMS:-(Steam,Xbox,PS5,Mac)}"
      PALWORLD_DIFFICULTY: "${PALWORLD_DIFFICULTY:-None}"
      PALWORLD_EXP_RATE: "${PALWORLD_EXP_RATE:-1.0}"
      PALWORLD_CAPTURE_RATE: "${PALWORLD_CAPTURE_RATE:-1.0}"
      PALWORLD_PVP: "${PALWORLD_PVP:-false}"
      PALWORLD_FRIENDLY_FIRE: "${PALWORLD_FRIENDLY_FIRE:-false}"
      PALWORLD_DEATH_PENALTY: "${PALWORLD_DEATH_PENALTY:-All}"
      PALWORLD_EGG_HATCH_TIME: "${PALWORLD_EGG_HATCH_TIME:-72.0}"
      PALWORLD_AUTO_SAVE_SPAN: "${PALWORLD_AUTO_SAVE_SPAN:-30.0}"
      TERRARIA_IMAGE: "${TERRARIA_IMAGE:-ghcr.io/pryaxis/tshock:stable}"
      TERRARIA_PORT: "${TERRARIA_PORT:-7777}"
      TERRARIA_REST_PORT: "${TERRARIA_REST_PORT:-7878}"
      TERRARIA_WORLD_NAME: "${TERRARIA_WORLD_NAME:-nas-world}"
      TERRARIA_WORLD_SIZE: "${TERRARIA_WORLD_SIZE:-2}"
      TERRARIA_DIFFICULTY: "${TERRARIA_DIFFICULTY:-1}"
      TERRARIA_MAX_PLAYERS: "${TERRARIA_MAX_PLAYERS:-8}"
      TERRARIA_SERVER_PASSWORD: "${TERRARIA_SERVER_PASSWORD:-}"
      TERRARIA_REST_TOKEN: "${TERRARIA_REST_TOKEN:-admin123}"
      TERRARIA_MOTD: "${TERRARIA_MOTD:-Synology Terraria Server}"
      PZ_IMAGE: "${PZ_IMAGE:-faudil/project-zomboid-server:latest}"
      PZ_PORT: "${PZ_PORT:-16261}"
      PZ_STEAM_PORT: "${PZ_STEAM_PORT:-16262}"
      PZ_STEAM_PORT_2: "${PZ_STEAM_PORT_2:-16263}"
      PZ_RCON_HOST_PORT: "${PZ_RCON_HOST_PORT:-27016}"
      PZ_SERVER_NAME: "${PZ_SERVER_NAME:-nas-zomboid}"
      PZ_PUBLIC_NAME: "${PZ_PUBLIC_NAME:-Synology Project Zomboid Server}"
      PZ_PUBLIC_SERVER: "${PZ_PUBLIC_SERVER:-true}"
      PZ_SERVER_PASSWORD: "${PZ_SERVER_PASSWORD:-}"
      PZ_ADMIN_PASSWORD: "${PZ_ADMIN_PASSWORD:-admin123}"
      PZ_RCON_PASSWORD: "${PZ_RCON_PASSWORD:-admin123}"
      PZ_MAX_PLAYERS: "${PZ_MAX_PLAYERS:-8}"
      PZ_MAX_RAM: "${PZ_MAX_RAM:-6144m}"
      PZ_PVP: "${PZ_PVP:-true}"
      PZ_PAUSE_ON_EMPTY: "${PZ_PAUSE_ON_EMPTY:-true}"
      PZ_STEAM_VAC: "${PZ_STEAM_VAC:-true}"
      PZ_MAP_NAMES: "${PZ_MAP_NAMES:-Muldraugh, KY}"
      PZ_AUTOSAVE_INTERVAL: "${PZ_AUTOSAVE_INTERVAL:-15}"
      PZ_SANDBOX_MODE: "${PZ_SANDBOX_MODE:-apocalypse}"
      PZ_MOD_WORKSHOP_IDS: "${PZ_MOD_WORKSHOP_IDS:-}"
      PZ_MOD_NAMES: "${PZ_MOD_NAMES:-}"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - "${HOST_PROJECT_PATH:-/volume1/docker/nas_game_server}:/host-project"
      # 直接运行 NAS 项目目录里的总控代码，避免群晖继续使用旧的镜像构建缓存。
      - "${HOST_PROJECT_PATH:-/volume1/docker/nas_game_server}/controller:/app:ro"
